name: Pull Docker Images

on:
  push:
    branches: [ main ]

jobs:
  pull-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker images
        run: |
          docker pull pavithra222001/ecommerce:product-service.1
          docker pull pavithra222001/ecommerce:payment-service.1
          docker pull pavithra222001/ecommerce:user-service.1

      - name: List images
        run: docker images
