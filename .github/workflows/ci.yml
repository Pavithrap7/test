name: Hello World Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Run Python script and save output
        run: |
          python hello.py > output.log 2>&1
          cat output.log  # optional: still see in Actions UI

      - name: Upload log as artifact
        uses: actions/upload-artifact@v3
        with:
          name: workflow-log
          path: output.log

