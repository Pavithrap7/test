name: Pull Docker Images

on:
  push:
    branches: [ main ]

jobs:
  pull-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.GITHUB_TOKEN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Docker images
        run: |
          docker pull yourdockerhubuser/image1:tag
          docker pull yourdockerhubuser/image2:tag
          docker pull yourdockerhubuser/image3:tag

      - name: List images
        run: docker images
