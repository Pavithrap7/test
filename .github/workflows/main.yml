name: CI

on:
  push:
    branches: ["main"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
      - name: install dependencies
        run: pip install -r req.txt

      - name: show repo
        run: find . -type f

      - name: run tests
        run: pytest .

        
